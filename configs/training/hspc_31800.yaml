ckpt_dir: paper_data/dynamics/hspc_31800
model:
  components:
  - velocity
  - growth
  growth_net:
    hidden_dim: 400
    n_layers: 2
    residual: false
  multi:
    Map_model_path: paper_data/maps/hspc_31800/best_model.pt
    hidden_dim: 64
    input_dim1: 50
    input_dim2: 50
    mapper_type: ae
    mode: (1,2)
    multi_alpha: 0.12
    multi_use: true
  velocity_net:
    hidden_dim: 400
    n_layers: 2
    residual: false
training:
  defaults:
    batch_size: 400
    lambda_ot_sec: 1.0
    lr: 6.0e-05
  plan:
  - OT_loss: sinkhorn_detach
    epochs: 180
    global_mass: false
    lambda_energy: 0
    lambda_mass: 1.0
    lambda_ot: 1.2
    lambda_ot_sec: 0.0
    method: ODEFunc
    mode: neural_ode
    name: Pretrain1
  - OT_loss: sinkhorn
    epochs: 40
    global_mass: true
    lambda_energy: 5.0
    lambda_mass: 8.0
    lambda_ot: 0.2
    lambda_ot_sec: 1.0
    method: ODEFunc
    mode: neural_ode
    name: Train
